name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: faiznutes/gudang1-frontend
  BACKEND_IMAGE_NAME: faiznutes/gudang1-backend
  PLAYWRIGHT_USE_PREVIEW: '1'
  PLAYWRIGHT_PORT: '4173'
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter @stockpilot/backend test

      - name: Run lint check
        run: pnpm lint:check

      - name: Build all packages
        run: pnpm build:all

      - name: Install Playwright browsers
        run: pnpm --filter @stockpilot/frontend exec playwright install --with-deps chromium

      - name: Run frontend smoke tests
        run: pnpm --filter @stockpilot/frontend test:e2e -- tests/auth.spec.ts tests/navigation.spec.ts tests/category.spec.ts tests/admin-access.spec.ts tests/pwa-popup.spec.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Coolify deploy
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_FRONTEND_APP_UUID: ${{ secrets.COOLIFY_FRONTEND_APP_UUID }}
          COOLIFY_BACKEND_APP_UUID: ${{ secrets.COOLIFY_BACKEND_APP_UUID }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: pnpm deploy:coolify
